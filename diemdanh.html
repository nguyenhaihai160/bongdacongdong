<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<title>Điểm Danh Học Viên</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
padding:15px;
}

h2{
text-align:center;
}

input,button{
padding:10px;
margin:5px 0;
width:100%;
font-size:16px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
margin-top:10px;
}

th,td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

th{
background:#222;
color:white;
}

button{
background:#27ae60;
color:white;
border:none;
}

</style>

</head>

<body>

<h2>⚽ Điểm Danh Buổi Tập</h2>

<h3>➕ Thêm học viên</h3>

<input id="tenhv" placeholder="Tên học viên">

<button onclick="themHV()">Thêm học viên</button>

<h3>📅 Ngày tập</h3>

<input type="date" id="ngayhoc">

<button onclick="taoDanhSach()">Tạo danh sách điểm danh</button>

<table>

<tr>
<th>Học viên</th>
<th>Có mặt</th>
</tr>

<tbody id="danhsach"></tbody>

</table>

<br>

<button onclick="diemDanh()">💾 Lưu điểm danh</button>

<script>

let hocvien = JSON.parse(localStorage.getItem("hocvien")) || []

function luu(){

localStorage.setItem("hocvien",JSON.stringify(hocvien))

}

function themHV(){

let ten = document.getElementById("tenhv").value

if(!ten){
alert("Nhập tên học viên")
return
}

let hv = {

ten:ten,
sdt:"",
namsinh:2015,
khoa:"",
tong:0,
hoc:0,
hocphi:0,
dong:0,
lichhoc:[]

}

hocvien.push(hv)

luu()

document.getElementById("tenhv").value=""

alert("Đã thêm học viên")

taoDanhSach()

}

function taoDanhSach(){

let html=""

hocvien.forEach((hv,i)=>{

html+=`

<tr>
<td>${hv.ten}</td>
<td><input type="checkbox" id="hv${i}"></td>
</tr>

`

})

document.getElementById("danhsach").innerHTML=html

}

function diemDanh(){

let ngay = document.getElementById("ngayhoc").value

if(!ngay){
alert("Chọn ngày học")
return
}

hocvien.forEach((hv,i)=>{

let c=document.getElementById("hv"+i)

if(c && c.checked){

hv.hoc++

if(!hv.lichhoc.includes(ngay)){
hv.lichhoc.push(ngay)
}

}

})

luu()

alert("Đã lưu điểm danh")

}

taoDanhSach()

</script>

</body>
</html>
